apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mayabank-platform-operator
rules:
  - apiGroups: ["platform.mayabank.example"]
    resources: ["capabilityconsumptions"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["platform.mayabank.example"]
    resources: ["capabilityconsumptions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts", "resourcequotas", "limitranges", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
