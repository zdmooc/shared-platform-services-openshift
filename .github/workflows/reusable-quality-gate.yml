name: Reusable Quality Gate

on:
  workflow_call:
    inputs:
      run_sonar:
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: bash scripts/validate-platform.sh
      - name: SonarQube contract
        if: ${{ inputs.run_sonar }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_HOST_URL"
          test -n "$SONAR_TOKEN"
          echo "SonarQube endpoint and token contract: PASS"
