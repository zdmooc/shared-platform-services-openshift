name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Structural and security validation
        run: bash scripts/validate-platform.sh

      - name: YAML lint
        run: yamllint -c .yamllint.yml config gitops platform

      - name: Render Kustomize surfaces
        shell: bash
        run: |
          set -euo pipefail
          dirs=(
            gitops/base
            platform/base
            platform/observability/otel
            platform/observability/prometheus
            platform/runtime-ci
            platform
          )
          mkdir -p /tmp/rendered
          for dir in "${dirs[@]}"; do
            out="/tmp/rendered/$(echo "$dir" | tr '/' '_').yaml"
            kubectl kustomize "$dir" > "$out"
            test -s "$out"
          done

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Kubernetes schema validation
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/rendered/*.yaml; do
            echo "Validating $file"
            kubeconform -strict -summary -ignore-missing-schemas "$file"
          done

      - name: Shell and Python syntax
        shell: bash
        run: |
          bash -n scripts/*.sh
          python -m compileall -q scripts
