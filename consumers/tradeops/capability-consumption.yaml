apiVersion: platform.mayabank.example/v1alpha1
kind: CapabilityConsumption
metadata:
  name: tradeops
spec:
  identity:
    mode: CONSUME_SHARED
  observability:
    mode: CONSUME_SHARED
  secrets:
    mode: CONSUME_SHARED
  gitops:
    mode: CONSUME_SHARED
  quality:
    mode: CONSUME_SHARED
  eventing:
    mode: DEDICATED_FOR_TEST
  database:
    mode: DEDICATED_FOR_TEST
  objectStorage:
    mode: REFERENCE_ONLY
  externalPlatforms:
    aiRoutingLab:
      mode: DEDICATED_FOR_TEST
      owner: TradeOps-GenAI-Integration
      exitGate: G5
  ownedCapabilities:
    - rag
    - agents
    - mcp-tools
    - deterministic-risk-gate
    - human-in-the-loop
    - paper-shadow-workflows
